version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5

    # Major bumps stay a deliberate decision. dist/ is committed here and
    # consumers read it straight from this repository, so a major that
    # changes what a component renders reaches them the moment dist/ is
    # rebuilt. That should happen when someone is ready to look at it.
    #
    # The "version-update:" prefix scopes this to version updates, so a
    # security fix that only exists in a newer major is still offered.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

    groups:
      # One pull request a week for routine updates, instead of one per
      # package.
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

      # Without this, a batch of advisories arrives as a batch of pull
      # requests: 64 alerts were open before this file existed.
      security:
        applies-to: security-updates
        patterns:
          - "*"

  # Actions are pinned to commit SHAs in the workflows, so without this
  # nothing would ever move them. Majors are not excluded the way they are
  # for npm: an action version cannot change what this library ships, and
  # staying current with them is itself a supply-chain measure.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    groups:
      actions:
        patterns:
          - "*"
